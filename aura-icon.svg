<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="120" height="120" fill="none">
    <defs>
        <!-- Cerulean Aura Gradient (Scientific Precision & Hormonal Balance) -->
        <linearGradient id="aura-logo-cerulean" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#00A3DE"/>
            <stop offset="60%" stop-color="#007BA7"/>
            <stop offset="100%" stop-color="#005B7A"/>
        </linearGradient>

        <!-- Jasper Aura Gradient (Vitality, Passion & Masculine Energy) -->
        <linearGradient id="aura-logo-jasper" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FF5256"/>
            <stop offset="60%" stop-color="#D73B3E"/>
            <stop offset="100%" stop-color="#A82C2E"/>
        </linearGradient>

        <!-- Crossbar Energy Bridge Gradient -->
        <linearGradient id="aura-logo-bridge" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#007BA7"/>
            <stop offset="100%" stop-color="#D73B3E"/>
        </linearGradient>

        <!-- Pure Editorial Disc Base Gradient -->
        <radialGradient id="aura-logo-disc" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#FFFFFF"/>
            <stop offset="80%" stop-color="#FDFBF7"/>
            <stop offset="100%" stop-color="#F4EFE6"/>
        </radialGradient>

        <!-- Drop shadow for subtle luxury depth -->
        <filter id="aura-logo-shadow" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#1A1A1A" flood-opacity="0.12"/>
        </filter>
    </defs>

    <!-- 1. Circular Editorial Medallion Base (Works on light, dark & paper backgrounds) -->
    <circle cx="50" cy="50" r="48" fill="url(#aura-logo-disc)" stroke="#D1CCC5" stroke-width="1.2"/>

    <!-- 2. Dual Dynamic Aura Orbit Arcs (Harmonic Life-Energy Corona) -->
    <!-- Upper-Left Cerulean Arc (140° to 310°) -->
    <path d="M 22.42 73.14 A 36 36 0 0 1 73.14 22.42" 
          stroke="url(#aura-logo-cerulean)" 
          stroke-width="5.5" 
          stroke-linecap="round"/>

    <!-- Lower-Right Jasper Arc (320° to 130°) -->
    <path d="M 77.58 26.86 A 36 36 0 0 1 26.86 77.58" 
          stroke="url(#aura-logo-jasper)" 
          stroke-width="5.5" 
          stroke-linecap="round"/>

    <!-- 3. Bio-Harmonic Concentric Orbit Ring -->
    <circle cx="50" cy="50" r="27.5" stroke="#D1CCC5" stroke-width="0.85" stroke-dasharray="2 3"/>

    <!-- Orbital Energy Nodes -->
    <circle cx="24.5" cy="75" r="1.8" fill="#007BA7"/>
    <circle cx="75.5" cy="25" r="1.8" fill="#D73B3E"/>

    <!-- 4. The Iconic Monogram "A." (Bespoke Editorial Serif) -->
    <g filter="url(#aura-logo-shadow)">
        <!-- Left Ascending Stem & Serif (Cerulean) -->
        <path d="M 31 71 L 41 71 L 39.5 68.5 L 37.5 68.5 L 45.8 32 L 49.2 32 L 43.5 68.5 L 41.5 68.5 Z" 
              fill="url(#aura-logo-cerulean)"/>

        <!-- Top Apex Harmonizing Crown -->
        <path d="M 44.5 32.5 C 47 30 50.5 30 53 32.5 L 50.5 34.5 C 49 33.5 48 33.5 47 34.5 Z" 
              fill="#007BA7"/>

        <!-- Right Descending Stem & Serif (Jasper - High Contrast Bold Roman) -->
        <path d="M 47.8 32 L 53.5 32 L 64 68.5 L 67 68.5 L 67 71 L 56 71 L 56 68.5 L 58.5 68.5 L 49.5 38 Z" 
              fill="url(#aura-logo-jasper)"/>

        <!-- Dynamic Energy Crossbar Bridge -->
        <path d="M 39 55.5 L 56.5 55.5 L 56 58.5 L 38.2 58.5 Z" 
              fill="url(#aura-logo-bridge)"/>

        <!-- Signature Aura Period Dot "." (Vital Jasper Core) -->
        <circle cx="71.5" cy="69" r="4" fill="url(#aura-logo-jasper)"/>
    </g>
</svg>