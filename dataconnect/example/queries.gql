mutation CreateUser($firstName: String!, $email: String!) @auth(level: USER) {
  user_insert(data: {
    id_expr: "auth.uid",
    firstName: $firstName,
    email: $email,
    createdAt_expr: "request.time"
  })
}

mutation UpdateUser($firstName: String, $email: String) @auth(level: USER) {
  user_update(key: {id_expr: "auth.uid"}, data: {
    firstName: $firstName,
    email: $email
  })
}

mutation DeleteUser @auth(level: USER) {
  user_delete(key: {id_expr: "auth.uid"})
}

query GetUser @auth(level: USER) {
  user(key: {id_expr: "auth.uid"}) {
    email
    firstName
    createdAt
  }
}

query ListUsers @auth(level: PUBLIC, insecureReason: "Listing users is publicly accessible for directory purposes.") {
  users {
    firstName
    email
  }
}

mutation CreateBiometricLog($metricType: String!, $value: Float!) @auth(level: USER) {
  biometricLog_insert(data: {
    userId_expr: "auth.uid",
    metricType: $metricType,
    value: $value,
    timestamp_expr: "request.time"
  })
}

mutation UpdateBiometricLog($id: UUID!, $value: Float) @auth(level: USER) {
  biometricLog_update(key: {id: $id}, data: {value: $value})
}

mutation DeleteBiometricLog($id: UUID!) @auth(level: USER) {
  biometricLog_delete(key: {id: $id})
}

query GetBiometricLog($id: UUID!) @auth(level: USER) {
  biometricLog(key: {id: $id}) {
    metricType
    value
    timestamp
  }
}

query ListBiometricLogs @auth(level: USER) {
  biometricLogs(where: {userId: {eq_expr: "auth.uid"}}) {
    metricType
    value
    timestamp
  }
}

